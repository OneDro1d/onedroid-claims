name: check the examples

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: the checker is the adopted one (claims-snapshot 0.6 with the carried cut of 13 Nov 2026)
        run: |
          echo "559e54a934fcca2ec70ef4b7ac60c1d9366cd4b98e56049f8556991789411947  check.py" > checker.sha256
          sha256sum -c checker.sha256
      - name: the checker reads every format up to 0.6 (imported from the checked-out tree, so no -I here)
        run: python3 -c "import check, sys; sys.exit(0 if 'claims-snapshot/0.6' in check.FORMATS and 'UNDECIDED' in check.WITNESS_VERDICTS and 'UNDECIDED' not in check.VERDICTS else 1)"
      - name: agent-work example
        run: python3 -I check.py examples/agent-work-s-i10-2026-11-12
      - name: test-run example
        run: python3 -I check.py examples/test-run-example-2026-11-12
      - name: the pre-witness stage suite (fixture A from the agent-work example; fixture B needs a snapshot this repository does not hold, skipped)
        run: python3 -I mutants06p.py
      - name: the K2 cut suite (both shapes of files, structural files refused, JSON lines split on newline only; no older checker here to compare with)
        run: python3 -I mutants06s.py --committed none
      - name: the carried cut suite (K11 reads a witness header's carried, add_witness refuses a mismatch, K3 on a non-object on_request; no older checker here)
        run: python3 -I mutants06c.py --committed none
      - name: the witness service's live output, agent-work (0.1.6, 13 Nov 2026, carried headers)
        run: python3 -I check.py examples/witness-service-aw4-2026-11-13
      - name: the witness service's live output, test-run (0.1.6, 13 Nov 2026, carried headers)
        run: python3 -I check.py examples/witness-service-tr4-2026-11-13
      - name: the key list parses (empty until the witness service mints keys)
        run: python3 -c "import json; [json.loads(l) for l in open('keys/model-keys.jsonl') if l.strip()]; print('key list ok')"
