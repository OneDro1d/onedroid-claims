name: check the examples

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: the checker is the adopted one (claims-snapshot 0.6, 12 Nov 2026)
        run: |
          echo "2bdd8ba9a1463e1e94dc139cc048ee688331c7b9a114f9b8f1be1948dd1f4e13  check.py" > checker.sha256
          sha256sum -c checker.sha256
      - name: the checker reads every format up to 0.6
        run: python3 -I -c "import check, sys; sys.exit(0 if 'claims-snapshot/0.6' in check.FORMATS and 'UNDECIDED' in check.WITNESS_VERDICTS and 'UNDECIDED' not in check.VERDICTS else 1)"
      - name: agent-work example
        run: python3 -I check.py examples/agent-work-s-i10-2026-11-12
      - name: test-run example
        run: python3 -I check.py examples/test-run-example-2026-11-12
      - name: the key list parses (empty until the witness service mints keys)
        run: python3 -I -c "import json; [json.loads(l) for l in open('keys/model-keys.jsonl') if l.strip()]; print('key list ok')"
