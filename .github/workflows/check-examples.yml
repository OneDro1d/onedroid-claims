name: check the examples

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: the checker is the 0.8 draft (claims-snapshot 0.8 of 16 Nov 2026, the decision profile; the 0.7 checker was b30d26ba, sha256 9bf4ddba)
        run: |
          echo "3ad87244fd683f914c4f233f9644c5fa96be63e4f9af32010bf9111752250698  check.py" > checker.sha256
          sha256sum -c checker.sha256
      - name: the checker reads every format up to 0.8 (imported from the checked-out tree, so no -I here)
        run: python3 -c "import check, sys; sys.exit(0 if 'claims-snapshot/0.8' in check.FORMATS and 'claims-snapshot/0.7' in check.FORMATS and 'claims-snapshot/0.6' in check.FORMATS and 'UNDECIDED' in check.WITNESS_VERDICTS and 'UNDECIDED' not in check.VERDICTS else 1)"
      - name: the 0.8 decision suite (SPEC 16, the decision profile's K1 and K11, gating on 0.8, the witness methods read and classify)
        run: python3 -I test08_decision.py
      - name: the 0.7 example (links, an anchor ref with a signer and a gvui, and its export verified by --export)
        run: python3 -I check.py examples/agent-work-0-7-links-2026-11-14 --export examples/agent-work-0-7-links-2026-11-14.exports/de06f00eca1ba699
      - name: the 0.7 compatibility suite (C3, every 0.6 rule on 0.7; the C1 survey needs the previous checker, not here)
        run: python3 -I test07_compat.py --committed none
      - name: the 0.7 links suite (L1 to L10, K16 and the six-section sources digest)
        run: python3 -I test07_links.py
      - name: the 0.7 anchor suite (G5 and G6, package.py keeps the signer, K14 reads signer and gvui)
        run: python3 -I test07_anchors.py
      - name: the 0.7 export suite (X1 to X4, X6, X7, X8; export.py needs the cryptography package, check.py does not)
        run: |
          python3 -m venv /tmp/export-venv
          /tmp/export-venv/bin/pip install --quiet cryptography==46.0.5
          /tmp/export-venv/bin/python -I test07_export.py
      - name: agent-work example
        run: python3 -I check.py examples/agent-work-s-i10-2026-11-12
      - name: test-run example
        run: python3 -I check.py examples/test-run-example-2026-11-12
      - name: the pre-witness stage suite (fixture A from the agent-work example; fixture B needs a snapshot this repository does not hold, skipped)
        run: python3 -I mutants06p.py
      - name: the K2 cut suite (both shapes of files, structural files refused, JSON lines split on newline only; no older checker here to compare with)
        run: python3 -I mutants06s.py --committed none
      - name: the carried cut suite (K11 reads a witness header's carried, add_witness refuses a mismatch, K3 on a non-object on_request; no older checker here)
        run: python3 -I mutants06c.py --committed none
      - name: the bound cut suite (K11 reads a witness header's bound against the record's own manifest, a decision rests on a carried file, add_witness refuses a bound mismatch; no older checker and no witness-service tree here)
        run: python3 -I mutants06d.py --committed none
      - name: the sources cut suite (a fifth signature role, sources, the auditor's key over the bound digest of the five bound sections, verified by K13 through every insertion; sign.py --role sources; no older checker here)
        run: python3 -I mutants06f.py --committed none
      - name: the auditor-key cut suite (one principal one key in allowed_signers, the sources signature's key is the key inside the audit signature, every signature's key is its principal's listed key, sign.py and add_witness.py refuse a second key under a name; no older checker here)
        run: python3 -I mutants06g.py --committed none
      - name: the one-auditor cut suite (one entry per role for auditor, sources and manifest, every signature file the prescribed name, the sources key is the key inside audit.jsonl.sig alone, grading.auditor.signer names that key, a model witness of service version 0.1.8 or later with carried and no bound fails K11; no older checker here)
        run: python3 -I mutants06h.py --committed none
      - name: the twelfth cut suite (K11 reads every version record and any at 0.1.8 or later fails, a signatures.json that is not a list, an entry that is not an object or an object entry with a wrong-shaped field or signer field fails K13 by name with the object entries still verified, never a traceback; a pattern principal in allowed_signers fails and a key-list failure is never counted as verified; a manifest.json of another shape fails K1 by name before any other check, and a part no rule names is a K0 FAIL with a SUMMARY, never a traceback, one report and one SUMMARY even when CHECK.json cannot be written, every --json exit writes CHECK.json and never through a symbolic link, and a lone surrogate never stops the SUMMARY; sign.py and add_witness.py refuse such a file, an unreadable file, a manifest of another shape or a wrong-shaped answer before writing; no older checker here)
        run: python3 -I mutants06i.py --committed none
      - name: the packager suite (step 1d, add_witness, the anchor call against a fake /anchor with 202 repeated under the same key, 503 and 403 handled, TLS with a private CA and a server-name override, a name mismatch or a wrong CA refused with nothing sent, the token never printed)
        run: python3 -I test_package.py
      - name: the seventh re-gate's genuine aw10 snapshot (a fixture, 13 Nov 2026)
        run: python3 -I check.py fixtures/aw10-regate7-2026-11-13
      - name: the seventh re-gate's forged insertion must FAIL (the models read dev's file under prod's name; the carried-cut checker passed it)
        run: |
          if python3 -I check.py fixtures/aw10-regate7-forged-insertion-u2-2026-11-13; then echo "the forged insertion passed"; exit 1; fi
          python3 -I check.py fixtures/aw10-regate7-forged-insertion-u2-2026-11-13 | grep -c "a file the witness did not carry"
      - name: the witness service's live output, agent-work (0.1.6, 13 Nov 2026, carried headers; one bound WARN since the bound cut, one sources WARN since the sources cut)
        run: python3 -I check.py examples/witness-service-aw4-2026-11-13
      - name: the witness service's live output, test-run (0.1.6, 13 Nov 2026, carried headers; one bound WARN since the bound cut, one sources WARN since the sources cut)
        run: python3 -I check.py examples/witness-service-tr4-2026-11-13
      - name: the snapshot index suite (make_index.py, I1 to I4)
        run: python3 -I test_make_index.py
      - name: snapshots/index.json is current (regenerate with python3 -I make_index.py and commit it)
        run: python3 -I make_index.py --check
      - name: the key list parses (empty until the witness service mints keys)
        run: python3 -c "import json; [json.loads(l) for l in open('keys/model-keys.jsonl') if l.strip()]; print('key list ok')"
      - name: the anchor signer list parses (0.7, empty until the first anchor grant is listed)
        run: python3 -c "import json; [json.loads(l) for l in open('keys/anchor-signers.jsonl') if l.strip()]; print('anchor signer list ok')"
